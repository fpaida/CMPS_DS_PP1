// 1. Implement the ArrayList using the prototype.
//
// Answer:
// The ArrayList was implemented using the prototype approach.
// Methods such as insert(), toString(), quickSort(), and binarySearch()
// were added to the ArrayList prototype.

function ArrayList() {
  this.array = [];
}

ArrayList.prototype.insert = function(item) {
  this.array.push(item);
};

ArrayList.prototype.toString = function() {
  return this.array.join(", ");
};

ArrayList.prototype.size = function() {
  return this.array.length;
};

ArrayList.prototype.getArray = function() {
  return this.array;
};

ArrayList.prototype.swap = function(index1, index2) {
  var temp = this.array[index1];
  this.array[index1] = this.array[index2];
  this.array[index2] = temp;
};


// 2. Complete the createNonSortedRandomArray(size) below by returning an
//    ArrayList with the numbers 1, 2, ..., size in random order.
//
// Answer:
// A random ArrayList is created by inserting the numbers 1 through size
// into an array and then shuffling them before returning the ArrayList.

function createNonSortedRandomArray(size) {
  var list = new ArrayList();

  for (var i = 1; i <= size; i++) {
    list.insert(i);
  }

  for (var j = list.size() - 1; j > 0; j--) {
    var randomIndex = Math.floor(Math.random() * (j + 1));
    list.swap(j, randomIndex);
  }

  return list;
}


// 3. Implement the Quick Sort algorithm and test your code.
//
// Answer:
// Quick Sort was implemented using recursion. The algorithm selects a
// pivot element, partitions the remaining values into smaller and larger
// groups, and recursively sorts both groups.

ArrayList.prototype.quickSort = function() {
  this.quick(this.array, 0, this.array.length - 1);
};

ArrayList.prototype.quick = function(array, left, right) {
  var index;

  if (array.length > 1) {
    index = this.partition(array, left, right);

    if (left < index - 1) {
      this.quick(array, left, index - 1);
    }

    if (index < right) {
      this.quick(array, index, right);
    }
  }
};

ArrayList.prototype.partition = function(array, left, right) {
  var pivot = array[Math.floor((right + left) / 2)];
  var i = left;
  var j = right;

  while (i <= j) {
    while (array[i] < pivot) {
      i++;
    }

    while (array[j] > pivot) {
      j--;
    }

    if (i <= j) {
      var temp = array[i];
      array[i] = array[j];
      array[j] = temp;
      i++;
      j--;
    }
  }

  return i;
};

// Test Quick Sort
var randomList = createNonSortedRandomArray(10);
console.log("Random list: " + randomList.toString());

randomList.quickSort();
console.log("Sorted list: " + randomList.toString());


// 4. Implement searching using the prototype.
//
// Answer:
// Sequential (linear) search was implemented using the prototype.
// The algorithm checks each element one by one until the value is found
// or the end of the list is reached.

ArrayList.prototype.sequentialSearch = function(item) {
  for (var i = 0; i < this.array.length; i++) {
    if (this.array[i] === item) {
      return i;
    }
  }

  return -1;
};


// 5. Implement the binary search algorithm and test your code.
//
// Answer:
// Binary Search was implemented using the prototype. Since binary search
// requires a sorted array, Quick Sort is used first. The algorithm
// repeatedly divides the search space in half until the value is found
// or no elements remain.

ArrayList.prototype.binarySearch = function(item) {
  this.quickSort();

  var low = 0;
  var high = this.array.length - 1;
  var mid;
  var element;

  while (low <= high) {
    mid = Math.floor((low + high) / 2);
    element = this.array[mid];

    if (element < item) {
      low = mid + 1;
    } else if (element > item) {
      high = mid - 1;
    } else {
      return mid;
    }
  }

  return -1;
};
